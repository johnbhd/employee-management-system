<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AU Employee Portal — Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" href="./img/aulogo.png">
    <link rel="apple-touch-icon" href="./img/aulogo.png">
    <link rel="stylesheet" type="text/css" href="./css/login.css">
  </head>
  <body>

    <div class="page">

      <!-- Left branding side -->
      <div class="brand-side">
        <img src="./img/new-au-logo.png" alt="Arellano University Logo" class="brand-logo">
        <h2 class="brand-title">Integrated HRIS, QR Attendance,<br>Payroll, and Accounting System</h2>
        <div class="brand-divider"></div>
        <p class="brand-subtitle">Employee Access Portal</p>

        <div class="brand-address">
          <i class="fa-solid fa-location-dot"></i>
          <span>Arellano University &ndash; Juan Sumulong Campus<br>2600 Legarda St., Sampaloc, Manila</span>
        </div>
      </div>

      <!-- Right login side -->
      <div class="login-side">
        <div class="container">

          <div class="brand-panel">
            <img src="./img/new-au-logo.png" alt="Arellano University Logo" class="logo">
            <h1>Arellano University</h1>
            <p class="subtitle">Employee Portal</p>
          </div>

          <div class="form-panel">
            <form id="loginform">
              <div class="form">
                <label for="username">Username</label>
                <div class="input-wrap">
                  <i class="fa-regular fa-user"></i>
                  <input type="text" id="username" name="username" required>
                </div>
              </div>

              <div class="form">
                <label for="password">Password</label>
                <div class="input-wrap">
                  <i class="fa-solid fa-lock"></i>
                  <input type="password" id="password" name="password" required>
                </div>

                <label class="remember">
                  <input type="checkbox" id="showPassword">
                  Show password
                </label>

                <div class="row-between">
                  <label class="remember">
                    <input type="checkbox" id="rememberMe">
                    Remember me
                  </label>
                </div>

                <div class="actions">
                  <input type="submit" value="Login" class="btn-primary btn-full">
                  <a href="/forgot-password"><i class="fa-solid fa-key"></i> Forgot password</a>
                  <a href="#" id="contactIt"><i class="fa-regular fa-comment-dots"></i> Contact IT Support</a>
                </div>
              </div>
            </form>
          </div>

        </div>
      </div>

    </div>

    <script>
      const showPasswordCheckbox = document.getElementById('showPassword');
      const passwordInput = document.getElementById('password');

      showPasswordCheckbox.addEventListener('change', function () {
        passwordInput.type = this.checked ? 'text' : 'password';
      });
    </script>
  </body>
</html>
